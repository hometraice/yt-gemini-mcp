# 每次 push／PR 在 Windows 上跑單元測試（只用 mock，不需要也不使用任何 key）。
name: tests

on:
  push:
  pull_request:

# 最小權限：只讀取程式碼
permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install uv
        run: python -m pip install "uv==0.13.9"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run --locked python -m unittest -v
