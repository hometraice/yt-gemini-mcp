# Version: v1.1 | 2026-11-21 | actions 升級到 Node 24 的版本，並鎖定 commit SHA
# 每次 push／PR 在 Windows 上跑單元測試（只用 mock，不需要也不使用任何 key）。
name: tests

on:
  push:
  pull_request:

# 最小權限：只讀取程式碼
permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # 供應鏈：第三方 action 鎖定 commit SHA（tag 可以被移動，SHA 不行），註解寫對應的版本。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"
      - name: Install uv
        run: python -m pip install "uv==0.13.9"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run unit tests
        run: uv run --locked python -m unittest -v
